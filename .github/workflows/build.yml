# XMB Launcher - Build 6 (PS3 wave engine: xmb-waves (MIT, Matthew Rahtz) tuned to the user's PS3, running behind the menu; PS3-style clock box)
# Replace this whole file to update. Code is stored gzip+base64 to stay small.
name: Build XMB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo files (sounds zip, fonts)
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write project files
        run: |
          mkdir -p proj/app/src/main/java/com/xmb/launcher proj/app/src/main/res/drawable proj/app/src/main/assets/sfx proj/app/src/main/assets/fonts proj/app/src/main/assets/icons
          cd proj
          cat > settings.gradle <<'EOF_XMB'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "xmb"
          include ':app'

          EOF_XMB
          cat > build.gradle <<'EOF_XMB'
          plugins { id 'com.android.application' version '8.5.2' apply false }

          EOF_XMB
          cat > gradle.properties <<'EOF_XMB'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false

          EOF_XMB
          cat > app/build.gradle <<'EOF_XMB'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.xmb.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.xmb.launcher'
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
                  versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'xmbpass123'
                      keyAlias 'xmb'
                      keyPassword 'xmbpass123'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              androidResources { noCompress 'wav', 'ogg', 'ttf', 'otf', 'TTF', 'OTF' }
              lint { checkReleaseBuilds false; abortOnError false }
          }

          EOF_XMB
          cat > app/src/main/AndroidManifest.xml <<'EOF_XMB'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <queries>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LEANBACK_LAUNCHER" /></intent>
              </queries>
              <application
                  android:label="XMB"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape"
                      android:resizeableActivity="false"
                      android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize|screenLayout|smallestScreenSize|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_XMB
          cat > app/src/main/res/drawable/banner.xml <<'EOF_XMB'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><size android:width="320dp" android:height="180dp" />
                  <gradient android:angle="270" android:startColor="#FF8A6A3A" android:endColor="#FF1E140A" /></shape></item>
              <item android:top="96dp" android:bottom="70dp"><shape android:shape="rectangle">
                  <gradient android:angle="0" android:startColor="#00FFFFFF" android:centerColor="#88FFFFFF" android:endColor="#00FFFFFF" /></shape></item>
          </layer-list>
          EOF_XMB
          cat > app/src/main/res/drawable/icon.xml <<'EOF_XMB'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape android:shape="rectangle"><size android:width="96dp" android:height="96dp" />
                  <gradient android:angle="270" android:startColor="#FF8A6A3A" android:endColor="#FF1E140A" /></shape></item>
              <item android:top="50dp" android:bottom="38dp"><shape android:shape="rectangle">
                  <gradient android:angle="0" android:startColor="#00FFFFFF" android:centerColor="#AAFFFFFF" android:endColor="#00FFFFFF" /></shape></item>
          </layer-list>
          EOF_XMB
          echo "" | base64 -d > app/release.jks
          echo "" | base64 -d | gunzip > app/src/main/java/com/xmb/launcher/MainActivity.java
          mkdir -p app/src/main/assets/xmb
          echo "" | base64 -d | gunzip > app/src/main/assets/xmb/index.html
          wc -l app/src/main/java/com/xmb/launcher/MainActivity.java

      - name: Add sounds and fonts from the repo
        run: |
          A=proj/app/src/main/assets
          Z=$(find . -path ./proj -prune -o -iname 'xmb-sounds*.zip' -print | head -n1)
          if [ -n "$Z" ]; then unzip -o -j "$Z" -d $A/sfx; else echo "::warning::xmb-sounds.zip not found in repo - app will be silent"; fi
          find . -path ./proj -prune -o -path ./.git -prune -o \( -iname '*.ttf' -o -iname '*.otf' \) -print | while read f; do cp "$f" $A/fonts/; done
          echo "Sounds:"; ls -la $A/sfx
          echo "Fonts:"; ls -la $A/fonts

      - name: Add RetroArch XMB icons (CC-BY 4.0)
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/libretro/retroarch-assets.git ra
          cd ra && git sparse-checkout set xmb/monochrome/png && cd ..
          P=ra/xmb/monochrome/png
          I=proj/app/src/main/assets/icons
          echo "Available icons:"; ls $P | tr '\n' ' '; echo
          pick() { out=$1; shift; for n in "$@"; do if [ -f "$P/$n" ]; then cp "$P/$n" "$I/$out.png"; echo "$out <- $n"; return; fi; done; echo "$out: none found, using drawn icon"; }
          pick settings setting.png settings.png
          pick music music.png
          pick video video.png movie.png
          pick game gamepad.png joypad.png core-input-remapping-options.png
          pick network network.png wifi.png netplay.png
          pick all all.png list.png playlist.png folder.png

      - name: Build APK
        run: |
          cd proj
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../xmb.apk

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest xmb.apk --title "XMB latest (run ${{ github.run_number }})" --notes "Build 6"